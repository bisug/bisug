name: Generate README Cards

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs daily at 00:00 UTC (pacman runs at 00:30; shared
    # concurrency group serializes pushes to the output branch)
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

# Shared with pacman.yml: both push to the output branch, so serialize
# instead of racing. cancel-in-progress is false so a run never cancels
# the other workflow's in-flight push (which would lose cards or pacman).
concurrency:
  group: output-branch-push
  cancel-in-progress: false

jobs:
  generate:
    name: Generate static cards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&theme=github_dark&show=prs_merged,prs_merged_percentage
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&hide_border=true&theme=github_dark&langs_count=6
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077 # v1.7.0
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&theme=github_dark&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy card
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Render trophy SVG
        run: |
          mkdir -p dist
          # Pinned to commit e3c89df (verified 2026-11-09). Verify before bumping:
          # curl -fsSL https://raw.githubusercontent.com/ryo-ma/github-profile-trophy/e3c89df995e92e67cdd4b2acaab9d974583dc1f7/render_svg.ts | head -n 20
          deno run --allow-net --allow-env --allow-read --allow-write \
            https://raw.githubusercontent.com/ryo-ma/github-profile-trophy/e3c89df995e92e67cdd4b2acaab9d974583dc1f7/render_svg.ts \
            ${{ github.repository_owner }} dist/trophy.svg darkhub
          if [ ! -s dist/trophy.svg ] || ! head -c 100 dist/trophy.svg | grep -q "<svg"; then
            echo "::error::trophy SVG render failed or invalid"
            exit 1
          fi
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}

      # Fetch the typing SVG once and commit it: the animation is embedded in
      # the SVG markup, so the static copy keeps animating on GitHub.
      # Fail loudly on invalid output so stale cards are visible in Actions.
      - name: Save typing SVG
        run: |
          mkdir -p dist
          curl -fsSL "https://readme-typing-svg.demolab.com/?font=Fira+Code&pause=1000&color=7C3AED&center=true&vCenter=true&width=500&lines=Cybersecurity+Student;Ethical+Hacking+%26+CTFs;Network+Fundamentals;Python+%7C+C%2B%2B+%7C+Go+%7C+TypeScript" -o dist/typing.svg.tmp
          if [ -s dist/typing.svg.tmp ] && head -c 100 dist/typing.svg.tmp | grep -q "<svg"; then
            mv dist/typing.svg.tmp dist/typing.svg
          else
            echo "::error::typing SVG fetch failed or invalid"
            rm -f dist/typing.svg.tmp
            exit 1
          fi

      # Profile summary cards: generate into the workspace, then copy into
      # ./dist so the single peaceiris step below pushes everything to the
      # output branch together. AUTO_PUSH is disabled to avoid a second,
      # conflicting push targeting the wrong branch.
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          AUTO_PUSH: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge summary cards into dist
        run: |
          if [ -d profile-summary-card-output ]; then
            rm -rf dist/profile-summary-card-output
            cp -r profile-summary-card-output ./dist/profile-summary-card-output
            # Drop upstream README wrappers and unreferenced 3-stats.svg
            # (duplicates stats.svg; README does not reference it).
            rm -rf \
              dist/profile-summary-card-output/README.md \
              dist/profile-summary-card-output/github_dark/README.md \
              dist/profile-summary-card-output/github_dark/3-stats.svg
          else
            echo "::error::profile-summary-card-output missing (rate-limit or upstream change)"
            exit 1
          fi

      - name: Push cards to output branch
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "chore: update README cards [skip ci]"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
