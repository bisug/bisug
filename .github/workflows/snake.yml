name: Generate Snake Animation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

# Cancel any in-progress run for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate cyberpunk snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots maps contribution levels empty -> most; first color = empty cell
          outputs: |
            dist/snake.svg?color_snake=#06b6d4&color_dots=#f1f5f9,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed&color_dot_border=#ffffff
            dist/snake-dark.svg?color_snake=#06b6d4&color_dots=#080615,#1e1040,#3b1fa0,#6d28d9,#a78bfa&color_dot_border=#1e1040

      - name: Push snake SVGs to output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "chore: update cyberpunk snake animation [skip ci]"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
